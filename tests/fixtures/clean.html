<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>clean fixture (human-crafted)</title>
<style>
  :root { --accent: #2563eb; }
  body { background: #ffffff; color: #1a1a1a; }
  .container { max-width: 72rem; margin: 0 auto; padding: 0 24px; }
  .card {
    border-radius: 8px;
    background: #f8fafc;
    border: 1px solid #e2e8e0;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    padding: 20px;
  }
  .btn { border-radius: 6px; background: var(--accent); color: #fff; }
  .hero h1 { font-size: 2rem; text-align: left; }
  .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  @media (prefers-color-scheme: dark) {
    body { background: #0f172a; color: #e2e8f0; }
    .card { background: #1e293b; border-color: #334155; }
  }
</style></head>
<body><div class="container">
<section class="hero"><h1>A modest title</h1></section>
<div class="features">
  <div class="card">a</div><div class="card">b</div><div class="card">c</div>
</div>
</div></body></html>
